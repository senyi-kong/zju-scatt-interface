[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zju-scatt-interface"
dynamic = ["version"]
description = "Search, retrieve, integrate, and visualize ZJU-SCATT optical data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Senyi Kong" }]
maintainers = [{ name = "ZJU-SCATT Team" }]
keywords = ["ZJU-SCATT", "atmospheric-radiation", "remote-sensing", "climate", "optical-properties"]
dependencies = ["numpy>=1.23", "h5py>=3.9", "netCDF4>=1.6", "matplotlib>=3.7"]

[project.optional-dependencies]
native = ["numpy>=1.23", "h5py>=3.9", "netCDF4>=1.6"]
netcdf = ["h5py>=3.9", "netCDF4>=1.6"]
plot = ["numpy>=1.23", "h5py>=3.9", "matplotlib>=3.7", "netCDF4>=1.6"]
all = ["numpy>=1.23", "h5py>=3.9", "matplotlib>=3.7", "netCDF4>=1.6"]
dev = ["build>=1.2", "h5py>=3.9", "netCDF4>=1.6", "ruff>=0.6", "twine>=5.0"]

[project.scripts]
zju-scatt = "zju_scatt_interface.cli.main:main"
zju-scatt-interface = "zju_scatt_interface.cli.main:main"
zju_scatt = "zju_scatt_interface.cli.main:main"
zju_scatt_interface = "zju_scatt_interface.cli.main:main"

[project.urls]
Homepage = "https://zju_radiation.deep-time.org/"
"Data browser" = "https://zju_radiation.deep-time.org/download"

[tool.setuptools]
package-dir = { zju_scatt_interface = "src" }
include-package-data = false

[tool.setuptools.package-data]
zju_scatt_interface = ["data/refractive_index/*.csv"]

[tool.setuptools.dynamic]
version = { attr = "zju_scatt_interface._version.__version__" }

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
